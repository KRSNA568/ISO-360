# Fly.io deployment configuration
# https://fly.io/docs/reference/configuration/

app       = "iso-audit360-api"
primary_region = "bom"          # Mumbai — closest to Indian user base

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT     = "5000"

[http_service]
  internal_port       = 5000
  force_https         = true
  auto_stop_machines  = true
  auto_start_machines = true
  min_machines_running = 1      # keep at least 1 warm to avoid cold starts

  [http_service.concurrency]
    type       = "requests"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus     = 1

[[services]]
  protocol    = "tcp"
  internal_port = 5000

  [[services.ports]]
    port     = 80
    handlers = ["http"]

  [[services.ports]]
    port     = 443
    handlers = ["tls", "http"]

  [services.http_checks]
    interval     = "15s"
    timeout      = "5s"
    grace_period = "20s"
    method       = "GET"
    path         = "/api/health"

# Staging app (deploy with: fly deploy --app iso-audit360-api-staging)
# [staging]
#   app = "iso-audit360-api-staging"
