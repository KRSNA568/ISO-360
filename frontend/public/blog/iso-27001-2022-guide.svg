<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="ISO 27001:2022 — A Practical Guide">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#13131a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#c9a961" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c9a961" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8cf8a"/>
      <stop offset="100%" stop-color="#b8923f"/>
    </linearGradient>
    <pattern id="grid1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#c9a961" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg1)"/>
  <rect width="1200" height="630" fill="url(#grid1)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>

  <!-- Concentric rings (ISMS layers) -->
  <g transform="translate(600 315)" opacity="0.5">
    <circle r="260" fill="none" stroke="#c9a961" stroke-opacity="0.08" stroke-width="1"/>
    <circle r="210" fill="none" stroke="#c9a961" stroke-opacity="0.12" stroke-width="1"/>
    <circle r="160" fill="none" stroke="#c9a961" stroke-opacity="0.18" stroke-width="1"/>
  </g>

  <!-- Shield -->
  <g transform="translate(600 285)">
    <path d="M 0 -150 L 120 -110 L 120 30 C 120 100 70 150 0 175 C -70 150 -120 100 -120 30 L -120 -110 Z"
          fill="#0f0f15" stroke="url(#gold1)" stroke-width="3"/>
    <path d="M 0 -150 L 120 -110 L 120 30 C 120 100 70 150 0 175 C -70 150 -120 100 -120 30 L -120 -110 Z"
          fill="url(#gold1)" fill-opacity="0.05"/>
    <!-- Checkmark -->
    <path d="M -45 10 L -10 45 L 55 -25" fill="none" stroke="url(#gold1)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- ISO text inside shield top -->
    <text x="0" y="-75" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="url(#gold1)" letter-spacing="3">ISO/IEC</text>
  </g>

  <!-- 27001:2022 badge -->
  <g transform="translate(600 510)">
    <rect x="-130" y="-26" width="260" height="52" rx="26" fill="#0f0f15" stroke="url(#gold1)" stroke-width="1.5"/>
    <text x="0" y="8" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#ffffff" letter-spacing="4">27001 : 2022</text>
  </g>

  <!-- Corner marks -->
  <g stroke="#c9a961" stroke-opacity="0.4" stroke-width="1.5" fill="none">
    <path d="M 50 50 L 50 90 M 50 50 L 90 50"/>
    <path d="M 1150 50 L 1150 90 M 1150 50 L 1110 50"/>
    <path d="M 50 580 L 50 540 M 50 580 L 90 580"/>
    <path d="M 1150 580 L 1150 540 M 1150 580 L 1110 580"/>
  </g>
</svg>
